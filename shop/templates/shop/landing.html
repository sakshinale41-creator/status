<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Status | Welcome</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Libre Baskerville', serif !important;
            background: #0b0b0b !important;
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .landing-card {
            position: relative;
            width: 340px;
            height: 480px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.9);
            text-decoration: none;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: block;
            background: linear-gradient(135deg, #1a1a1a 0%, #0d0d0d 100%);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .landing-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 30px 60px rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .landing-overlay {
            position: absolute;
            bottom: 30px;
            left: 20px;
            right: 20px;
            background: rgba(20, 20, 20, 0.9);
            border-radius: 12px;
            padding: 22px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
        }

        .landing-title {
            color: #ffffff;
            font-size: 1.8rem;
            font-weight: 700;
            margin: 0;
            letter-spacing: 1px;
        }

        .landing-sub {
            color: #d0d0d0;
            font-size: 0.85rem;
            margin-top: 8px;
            margin-bottom: 0;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
    </style>
</head>
<body>

    <a href="{% url 'shop:product_list' %}" class="landing-card">
        <div class="landing-overlay">
            <h1 class="landing-title">Men's Wear</h1>
            <p class="landing-sub">Click to Explore Collections</p>
        </div>
    </a>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
