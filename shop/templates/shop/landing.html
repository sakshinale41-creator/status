{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Status Clothing Line | Welcome</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { min-height: 100vh; display:flex; align-items:center; justify-content:center; padding: 24px;
               background: radial-gradient(circle at 20% 15%, #f6f2e4 0%, #e9dfc6 60%, #dccdae 100%) !important; }
        .welcome { text-align:center; max-width: 460px; }
        .welcome img { width: 190px; height: 190px; border-radius: 50%; object-fit: cover; box-shadow: 0 18px 40px rgba(85,56,47,.22); border: 6px solid #6d4c41; }
        .welcome h1 { font-size: clamp(2.2rem, 7vw, 3.2rem); color: #55382f; font-weight: 600; margin: 1.6rem 0 .5rem; line-height: 1.05; }
        .welcome p { color: #6d5a50; margin-bottom: 1.8rem; }
        .welcome .btn { padding: .8rem 2.2rem; font-size: 1.05rem; }
        .welcome .loc { margin-top: 1.6rem; font-size: .85rem; color: #7a6d66; }
    </style>
    {% include 'shop/_theme.html' %}
</head>
<body>
    <main class="welcome">
        <img src="{% static 'images/shop_logo.jpeg' %}" alt="Status Clothing Line">
        <h1>Welcome to<br>Status</h1>
        <p>Men's clothing, made to be remembered.</p>
        <a href="{% url 'shop:product_list' %}" class="btn btn-primary">Explore Collection <i class="bi bi-arrow-right ms-1"></i></a>
        <div class="loc"><i class="bi bi-geo-alt"></i> Kale Bazar Peth, Kolhapur</div>
    </main>
</body>
</html>
