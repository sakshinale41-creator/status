{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Success | Status Men's Wear</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffffff;
        }
        .navbar {
            background-color: #c4a47c !important; /* Dashboard sarakha brown shade */
            border-bottom: 1px solid #b39268;
        }
        .navbar-brand {
            color: #1e3a8a !important; /* Deep blue font */
            font-weight: 700;
        }
        .card {
            border: 1px solid #e5e7eb;
            box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
            border-radius: 0.75rem;
            background-color: #ffffff;
        }
        .btn-primary-custom {
            background-color: #1e3a8a;
            border-color: #1e3a8a;
            color: white;
        }
        .btn-primary-custom:hover {
            background-color: #172554;
            border-color: #172554;
            color: white;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg sticky-top shadow-sm py-3">
        <div class="container position-relative">
            <!-- Back to Shop Button -->
            <a href="{% url 'shop:product_list' %}" class="btn btn-outline-dark btn-sm rounded-pill px-3">
                <i class="bi bi-arrow-left me-1"></i> Back to Shop
            </a>
            <!-- Centered Brand Name -->
            <a class="navbar-brand fs-3 position-absolute start-50 translate-middle-x m-0" href="{% url 'shop:product_list' %}">
                Status
            </a>
        </div>
    </nav>

    <!-- Success Section -->
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-6 text-center">
                <div class="card p-4 p-md-5">
                    <div class="mb-3 text-success">
                        <i class="bi bi-check-circle-fill display-3"></i>
                    </div>
                    <h2 class="fw-bold mb-3 text-dark">Order Confirmed!</h2>
                    <p class="text-muted mb-4">Thank you for shopping with us. Your order has been placed successfully.</p>

                    <div class="p-3 bg-light rounded-3 mb-4 border">
                        <span class="text-secondary d-block small mb-1">Your Order ID</span>
                        <span class="fw-bold fs-4 text-primary">#{{ order.id }}</span>
                    </div>

                    <div class="d-grid gap-2">
                        <!-- Track Your Order Button -->
                        <a href="{% url 'shop:track_order' %}" class="btn btn-outline-primary btn-lg fw-bold rounded-3 py-3">
                            <i class="bi bi-truck me-2"></i> Track Your Order
                        </a>
                        <!-- Continue Shopping Button -->
                        <a href="{% url 'shop:product_list' %}" class="btn btn-primary-custom btn-lg fw-bold rounded-3 shadow-sm py-3">
                            <i class="bi bi-bag-check me-2"></i> Continue Shopping
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-white border-top text-dark py-4 mt-auto">
        <div class="container text-center">
            <p class="mb-0 text-muted">&copy; 2026 Status Men's Wear. All Rights Reserved.</p>
        </div>
    </footer>

</body>
</html>
