<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Placed Successfully | Mens Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold fs-4" href="{% url 'shop:product_list' %}">
                <i class="bi bi-bag-heart-fill text-primary me-2"></i>Mens Shop
            </a>
        </div>
    </nav>

    <!-- Success Message Card -->
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-6 text-center">
                <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5">
                    <div class="mb-3">
                        <i class="bi bi-check-circle-fill text-success display-1"></i>
                    </div>
                    <h2 class="fw-bold text-dark mb-2">Order Confirmed!</h2>
                    <p class="text-muted mb-4">Thank you for shopping with us. Your order has been placed successfully.</p>

                    <!-- Order ID Box -->
                    <div class="bg-light border rounded-3 p-3 mb-4">
                        <span class="text-muted d-block small mb-1">Your Order ID</span>
                        <h4 class="fw-bold text-primary mb-0">#{{ order.id }}</h4>
                    </div>

                    <!-- Action Buttons -->
                    <div class="d-grid gap-2">
                        <a href="{% url 'shop:track_order' %}" class="btn btn-outline-primary btn-lg rounded-3 fw-bold">
                            <i class="bi bi-truck me-2"></i> Track Your Order
                        </a>
                        <a href="{% url 'shop:product_list' %}" class="btn btn-dark btn-lg rounded-3 fw-bold">
                            <i class="bi bi-cart-plus me-2"></i> Continue Shopping
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-dark text-light py-4 mt-auto">
        <div class="container text-center">
            <p class="mb-0">&copy; 2026 Mens Shop. All Rights Reserved.</p>
        </div>
    </footer>

</body>
</html>
