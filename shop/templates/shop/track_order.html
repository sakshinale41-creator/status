{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Profile | Status Men's Wear</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffffff;
        }
        .card {
            border: 1px solid #e5e7eb;
            box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
            border-radius: 0.75rem;
            background-color: #ffffff;
        }
        .btn-primary-custom {
            background-color: #1e3a8a;
            border-color: #1e3a8a;
            color: white;
        }
        .btn-primary-custom:hover {
            background-color: #172554;
            border-color: #172554;
            color: white;
        }
    </style>
</head>
<body>

    <!-- Navbar with Brown Background -->
    <nav class="navbar navbar-expand-lg sticky-top shadow-sm py-3 border-bottom" style="background-color: #c4a47c !important;">
        <div class="container position-relative">
            <!-- Store Button -->
            <a href="{% url 'shop:product_list' %}" class="btn btn-outline-dark btn-sm rounded-pill px-3">
                <i class="bi bi-shop me-1"></i> Store
            </a>
            <!-- Centered Brand Name -->
            <a class="navbar-brand fs-3 fw-bold position-absolute start-50 translate-middle-x m-0" href="{% url 'shop:product_list' %}" style="color: #1e3a8a !important;">
                Status
            </a>
            <!-- Cart Button -->
            <a href="{% url 'shop:cart_detail' %}" class="btn btn-outline-dark btn-sm rounded-pill px-3">
                <i class="bi bi-cart3 me-1"></i> Cart
            </a>
        </div>
    </nav>

    <!-- Track Order / Profile Section -->
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card p-4 p-md-5">
                    <h3 class="fw-bold mb-3 text-dark"><i class="bi bi-person-circle me-2 text-primary"></i>Customer Profile</h3>
                    <p class="text-muted mb-4">Enter your registered phone number to view your order history and track live statuses.</p>

                    <form method="GET">
                        <div class="input-group mb-3">
                            <input type="text" name="phone" class="form-control form-control-lg fs-6" placeholder="Enter Phone Number..." required>
                            <button type="submit" class="btn btn-primary-custom btn-lg px-4 fw-bold shadow-sm">
                                View Orders
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-white border-top text-dark py-4 mt-auto">
        <div class="container text-center">
            <p class="mb-0 text-muted">&copy; 2026 Status Men's Wear. All Rights Reserved.</p>
        </div>
    </footer>

</body>
</html>
