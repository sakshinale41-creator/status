<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Status</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Libre Baskerville', serif !important; background-color: #f8f9fa; }
        .auth-card { border: none; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
        .form-control { border-radius: 8px; padding: 10px 15px; }
        .helptext, ul.errorlist { font-size: 0.8rem; color: #6c757d; margin-top: 4px; padding-left: 0; list-style: none; }
        ul.errorlist { color: #dc3545; }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 py-4">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card auth-card p-4 p-md-5 bg-white">
                    <div class="text-center mb-4">
                        <h2 class="fw-bold text-primary">Status</h2>
                        <p class="text-muted small">Create your customer account</p>
                    </div>

                    <form method="POST">
                        {% csrf_token %}

                        {% for field in form %}
                            <div class="mb-3">
                                <label class="form-label fw-semibold small text-secondary">{{ field.label }}</label>
                                {{ field }}
                                {% if field.help_text %}
                                    <div class="form-text text-muted" style="font-size: 0.75rem;">{{ field.help_text|safe }}</div>
                                {% endif %}
                                {% for error in field.errors %}
                                    <div class="text-danger small mt-1">{{ error }}</div>
                                {% endfor %}
                            </div>
                        {% endfor %}

                        <button type="submit" class="btn btn-primary w-100 py-2 rounded-pill mt-3 shadow-sm fw-semibold">Sign Up</button>
                    </form>

                    <div class="text-center mt-4">
                        <p class="small text-muted">Already have an account? <a href="{% url 'shop:login' %}" class="text-decoration-none fw-bold text-primary">Login</a></p>
                        <a href="{% url 'shop:product_list' %}" class="small text-decoration-none text-secondary"><i class="bi bi-arrow-left"></i> Back to Store</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Automatically add bootstrap 'form-control' class to all Django form inputs
        document.querySelectorAll('input').forEach(function(element) {
            element.classList.add('form-control');
        });
    </script>
</body>
</html>
