<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP | Status</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Libre Baskerville', serif !important; background-color: #f8f9fa; }
        .auth-card { border: none; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
        .form-control { border-radius: 8px; padding: 12px 15px; letter-spacing: 2px; text-align: center; font-weight: bold; }
        .btn-primary-meesho { background-color: #9f2089; border: none; }
        .btn-primary-meesho:hover { background-color: #821970; }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="card auth-card p-4 p-md-5 bg-white">
                    <div class="text-center mb-4">
                        <h2 class="fw-bold" style="color: #9f2089 !important;">Enter OTP</h2>
                        <p class="text-muted small">Please enter the 4-digit verification code sent to your mobile.<br><span class="text-danger fw-semibold">(Demo OTP: 1234)</span></p>
                    </div>

                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <input type="text" name="otp" class="form-control" placeholder="••••" maxlength="4" required>
                        </div>

                        <button type="submit" class="btn btn-primary btn-primary-meesho w-100 py-2 rounded-pill mt-3 shadow-sm fw-semibold text-white">Verify & Sign Up</button>
                    </form>

                    <div class="text-center mt-4">
                        <a href="{% url 'shop:phone_signup' %}" class="small text-decoration-none text-secondary"><i class="bi bi-arrow-left"></i> Change Phone Number</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
