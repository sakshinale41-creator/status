<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Status Men's Wear</title>
    <style>
        body {
            background: linear-gradient(135deg, #f3efe2, #e6dcc6);
            font-family: 'Jost', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
        }
        .register-container {
            background: white;
            width: 100%;
            max-width: 420px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }
        .title {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            color: #6d4c41;
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            font-size: 15px;
            color: #666;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 6px;
            color: #333;
        }
        .form-group input {
            width: 100%;
            padding: 11px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }
        .form-group input:focus {
            border-color: #6d4c41;
            box-shadow: 0 0 5px rgba(79, 70, 229, 0.25);
        }
        button {
            width: 100%;
            padding: 12px;
            background: #6d4c41;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background: #55382f;
        }
        .login-text {
            text-align: center;
            margin-top: 18px;
            font-size: 14px;
            color: #666;
        }
        .login-text a {
            color: #6d4c41;
            font-weight: bold;
            text-decoration: none;
        }
        .login-text a:hover {
            text-decoration: underline;
        }
        .error-message {
            color: red;
            font-size: 14px;
            margin-bottom: 15px;
            text-align: center;
        }
    </style>
    {% include 'shop/_theme.html' %}
</head>
<body>
    <div class="register-container">
        <h1 class="title">Status Men's Wear</h1>
        <p class="subtitle">Create your account</p>

        {% if error %}
            <p class="error-message">{{ error }}</p>
        {% endif %}

        <form class="register-form" method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter your username" required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>

            <div class="form-group">
                <label for="confirm_password">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm your password" required>
            </div>

            <button type="submit">Register</button>

            <p class="login-text">Already have an account? <a href="{% url 'shop:customer_login' %}">Login</a></p>
        </form>
    </div>
</body>
</html>
