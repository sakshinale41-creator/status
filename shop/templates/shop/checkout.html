<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | Mens Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold fs-4" href="{% url 'shop:product_list' %}">
                <i class="bi bi-bag-heart-fill text-primary me-2"></i>Mens Shop
            </a>
            <a href="{% url 'shop:cart_detail' %}" class="btn btn-outline-light btn-sm">
                <i class="bi bi-cart3 me-1"></i> Back to Cart
            </a>
        </div>
    </nav>

    <!-- Checkout Form -->
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card border-0 shadow-sm rounded-4 p-4">
                    <h3 class="fw-bold mb-4"><i class="bi bi-receipt me-2"></i>Checkout Details</h3>

                    <form method="POST">
                        {% csrf_token %}
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Full Name</label>
                                <input type="text" name="first_name" class="form-control" placeholder="John Doe" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Phone Number</label>
                                <input type="tel" name="phone" class="form-control" placeholder="10-digit mobile number" required>
                            </div>
                            <div class="col-12">
                                <label class="form-label fw-semibold">Delivery Address</label>
                                <textarea name="address" class="form-control" rows="3" placeholder="Flat, Street, Area, City, Pincode" required></textarea>
                            </div>
                        </div>

                        <hr class="my-4">

                        <button type="submit" class="btn btn-success btn-lg w-100 fw-bold rounded-3">
                            <i class="bi bi-check-circle me-2"></i> Place Order Now
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-dark text-light py-4 mt-auto">
        <div class="container text-center">
            <p class="mb-0">&copy; 2026 Mens Shop. All Rights Reserved.</p>
        </div>
    </footer>

</body>
</html>
