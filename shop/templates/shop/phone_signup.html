<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Status</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Libre Baskerville', serif !important; background-color: #f8f9fa; }
        .auth-card { border: none; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
        .form-control { border-radius: 8px; padding: 12px 15px; }
        .btn-primary-meesho { background-color: #9f2089; border: none; }
        .btn-primary-meesho:hover { background-color: #821970; }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="card auth-card p-4 p-md-5 bg-white">
                    <div class="text-center mb-4">
                        <h2 class="fw-bold text-primary" style="color: #9f2089 !important;">Status</h2>
                        <p class="text-muted small">Sign up to access your orders</p>
                    </div>

                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label fw-semibold small text-secondary">Phone Number</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light text-muted">+91</span>
                                <input type="text" name="phone_number" class="form-control" placeholder="Enter mobile number" required pattern="[0-9]{10}" maxlength="10">
                            </div>
                            <div class="form-text small text-muted mt-1">We'll send a 4-digit OTP for verification.</div>
                        </div>

                        <button type="submit" class="btn btn-primary btn-primary-meesho w-100 py-2 rounded-pill mt-3 shadow-sm fw-semibold text-white">Send OTP</button>
                    </form>

                    <div class="text-center mt-4">
                        <a href="{% url 'shop:product_list' %}" class="small text-decoration-none text-secondary"><i class="bi bi-arrow-left"></i> Back to Store</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
