<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ product.name }} | Status</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Libre Baskerville', serif !important; background-color: #f8f9fa; }
        .navbar-brand { font-size: 2.2rem !important; font-weight: 700; color: #174A8B !important; }
        .main-img { height: 450px; object-fit: cover; border-radius: 12px; }
        .size-btn { border: 1px solid #ced4da; border-radius: 50px; padding: 8px 20px; font-weight: 600; color: #333; background: #fff; transition: all 0.2s; cursor: pointer; }
        .size-btn:hover, .size-btn.active { border-color: #174A8B; color: #174A8B; background-color: #f0f4f8; }
        .btn-cart { border: 2px solid #174A8B; color: #174A8B; background: #fff; font-weight: 600; border-radius: 8px; padding: 12px; }
        .btn-cart:hover { background-color: #f0f4f8; color: #174A8B; }
        .btn-buy { background-color: #174A8B; color: #fff; font-weight: 600; border-radius: 8px; padding: 12px; border: none; }
        .btn-buy:hover { background-color: #12376d; color: #fff; }
    </style>
</head>
<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white sticky-top shadow-sm py-3">
        <div class="container">
            <a class="navbar-brand" href="{% url 'shop:product_list' %}">Status</a>
            <div class="d-flex align-items-center gap-3">
                <a href="{% url 'shop:cart_detail' %}" class="text-dark text-decoration-none d-flex align-items-center gap-1">
                    <i class="bi bi-cart3 fs-5"></i>
                    <span class="small fw-medium">Cart</span>
                </a>
            </div>
        </div>
    </nav>

    <!-- Product Detail Section -->
    <div class="container my-5">
        <div class="row g-5">
            <!-- Left Side: Product Image -->
            <div class="col-md-6">
                <div class="card border-0 shadow-sm p-3 bg-white rounded-4">
                    {% if product.image %}
                        <img src="{{ product.image.url }}" class="card-img-top main-img" alt="{{ product.name }}">
                    {% else %}
                        <div class="bg-secondary text-white d-flex align-items-center justify-content-center main-img">No Image</div>
                    {% endif %}
                </div>
            </div>

            <!-- Right Side: Details & Actions -->
            <div class="col-md-6">
                <div class="card border-0 shadow-sm p-4 bg-white rounded-4">
                    <h2 class="fw-bold text-dark fs-3 mb-2">{{ product.name }}</h2>
                    <h3 class="fw-bold text-primary mb-4">₹{{ product.price }}</h3>

                    <!-- Select Size Section -->
                    <div class="mb-4">
                        <label class="form-label fw-bold text-dark mb-2">Select Size: <span id="selected-size-text" class="text-primary">S</span></label>
                        <div class="d-flex flex-wrap gap-2" id="size-container">
                            <button type="button" class="size-btn active" data-size="S">S</button>
                            <button type="button" class="size-btn" data-size="M">M</button>
                            <button type="button" class="size-btn" data-size="L">L</button>
                            <button type="button" class="size-btn" data-size="XL">XL</button>
                            <button type="button" class="size-btn" data-size="XXL">XXL</button>
                        </div>
                    </div>

                    <!-- Action Buttons -->
                    <div class="row g-2 mb-4">
                        <div class="col-6">
                            <a href="{% url 'shop:add_to_cart' product.id %}?size=S" id="add-to-cart-btn" class="btn btn-cart w-100 d-flex align-items-center justify-content-center gap-2">
                                <i class="bi bi-cart2 fs-5"></i> Add to Cart
                            </a>
                        </div>
                        <div class="col-6">
                            <a href="{% url 'shop:checkout' %}" class="btn btn-buy w-100 d-flex align-items-center justify-content-center gap-2">
                                <i class="bi bi-lightning-charge-fill"></i> Buy Now
                            </a>
                        </div>
                    </div>

                    <!-- Product Description -->
                    {% if product.description %}
                    <div class="border-top pt-3">
                        <h5 class="fw-bold fs-6 mb-2">Product Description</h5>
                        <p class="text-muted small mb-0">{{ product.description }}</p>
                    </div>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>

    <script>
        // JavaScript to handle size selection and update Add to Cart URL
        const sizeButtons = document.querySelectorAll('.size-btn');
        const selectedSizeText = document.getElementById('selected-size-text');
        const addToCartBtn = document.getElementById('add-to-cart-btn');
        const baseUrl = "{% url 'shop:add_to_cart' product.id %}";

        sizeButtons.forEach(button => {
            button.addEventListener('click', function() {
                // Remove active class from all buttons
                sizeButtons.forEach(btn => btn.classList.remove('active'));
                // Add active class to clicked button
                this.classList.add('active');

                const selectedSize = this.getAttribute('data-size');
                selectedSizeText.textContent = selectedSize;

                // Update Add to Cart link with size query parameter
                addToCartBtn.href = `${baseUrl}?size=${selectedSize}`;
            });
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
