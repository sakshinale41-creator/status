{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment | Status Men's Wear</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffffff;
        }
        .btn-theme-custom {
            background-color: #1e3a8a !important;
            border-color: #1e3a8a !important;
            color: white !important;
        }
        .btn-theme-custom:hover {
            background-color: #172554 !important;
            border-color: #172554 !important;
            color: white !important;
        }
    </style>
</head>
<body class="bg-light">

    <!-- Navbar with Brown Background -->
    <nav class="navbar navbar-expand-lg sticky-top shadow-sm py-3 border-bottom" style="background-color: #c4a47c !important;">
        <div class="container position-relative">
            <!-- Store Button -->
            <a href="{% url 'shop:product_list' %}" class="btn btn-outline-dark btn-sm rounded-pill px-3">
                <i class="bi bi-shop me-1"></i> Store
            </a>
            <!-- Centered Brand Name -->
            <a class="navbar-brand fs-3 fw-bold position-absolute start-50 translate-middle-x m-0" href="{% url 'shop:product_list' %}" style="color: #1e3a8a !important;">
                Status
            </a>
            <!-- Cart Button -->
            <a href="{% url 'shop:cart_detail' %}" class="btn btn-outline-dark btn-sm rounded-pill px-3">
                <i class="bi bi-cart3 me-1"></i> Cart
            </a>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card border-0 shadow-sm rounded-4 p-4 text-center bg-white">
                    <h3 class="fw-bold mb-3 text-dark"><i class="bi bi-shield-lock-fill text-primary me-2"></i>Complete Your Payment</h3>
                    <p class="text-muted">Order ID: <strong class="text-dark">#{{ order.id }}</strong></p>
                    <h4 class="text-success fw-bold mb-4">Total Amount: ₹{{ order.total_amount }}</h4>

                    <!-- Status Men's Wear Shop QR Code -->
                    <div class="bg-white p-3 border rounded-4 d-inline-block mx-auto mb-4 shadow-sm">
                        <img src="{% static 'images/shop_qr.jpg' %}" alt="Status Men's Wear QR Code" class="img-fluid rounded-3" style="width: 200px; height: 200px; object-fit: contain;">
                        <p class="small text-muted mt-2">Scan & Pay using GPay / PhonePe / Paytm</p>
                    </div>

                    <form action="{% url 'shop:order_success' order.id %}" method="POST">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-theme-custom btn-lg w-100 fw-bold rounded-3 shadow-sm py-3">
                        <i class="bi bi-check-circle me-2"></i> I Have Paid / Confirm Order
                    </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
